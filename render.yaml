# Blueprint: one Node web service. Optional keys have empty defaults so Apply is not blocked.
# Required to type in the dashboard: OPENROUTER_API_KEY, ADMIN_PASSWORD, SESSION_SECRET, NEXT_PUBLIC_SITE_URL.

services:
  - type: web
    name: one-health-ghana
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22.12.0"
      - key: OPENROUTER_APP_TITLE
        value: ONE HEALTH GHANA
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_HTTP_REFERER
        sync: false
      - key: ADMIN_EMAIL
        value: admin@ghs.gov.gh
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: GHS Administrator
      - key: SESSION_SECRET
        sync: false
      - key: TAVILY_API_KEY
        value: ""
      - key: ELEVENLABS_API_KEY
        value: ""
      - key: ELEVENLABS_VOICE_ID
        value: ""
      - key: OPENWEATHER_API_KEY
        value: ""
      - key: DATABASE_URL
        value: ""
