# Blueprint: free web + free Postgres so history survives web restarts.
# Required dashboard secrets: OPENROUTER_API_KEY, ADMIN_PASSWORD, SESSION_SECRET, NEXT_PUBLIC_SITE_URL.

databases:
  - name: one-health-db
    plan: free
    databaseName: onehealth
    user: onehealth

services:
  - type: web
    name: one-health-ghana
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22.12.0"
      - key: OPENROUTER_APP_TITLE
        value: ONE HEALTH GHANA
      - key: DATABASE_URL
        fromDatabase:
          name: one-health-db
          property: connectionString
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_HTTP_REFERER
        sync: false
      - key: ADMIN_EMAIL
        value: admin@ghs.gov.gh
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: GHS Administrator
      - key: SESSION_SECRET
        sync: false
      # Dashboard secrets — never pin empty strings here or a Blueprint apply wipes keys.
      - key: TAVILY_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        sync: false
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: OPENROUTER_MODELS
        sync: false
