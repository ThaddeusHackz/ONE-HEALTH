# Blueprint: free web + free Postgres so history survives web restarts.
# Required dashboard secrets: GEMINI_API_KEY, ADMIN_PASSWORD, SESSION_SECRET, NEXT_PUBLIC_SITE_URL.
#
# GEMINI_API_KEY (https://aistudio.google.com/apikey) is the whole AI engine:
#   chat + reasoning, the agentic loop and tool calling, vision (every file and
#   image read), deep research, image generation, speech-to-text and
#   text-to-speech. GEMINI_MODELS / GEMINI_IMAGE_MODELS override the model chains.
#
# Optional dashboard secrets that light up extra surfaces:
#   TAVILY_API_KEY (live web + deep research sources)
#   UNSPLASH_ACCESS_KEY (stock photos)
#   ELEVENLABS_API_KEY (premium voice out; Gemini TTS is the fallback)
#   OPENWEATHER_API_KEY (climate pillar)

databases:
  - name: one-health-db
    plan: free
    databaseName: onehealth
    user: onehealth

services:
  - type: web
    name: one-health-ghana
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22.12.0"
      - key: DATABASE_URL
        fromDatabase:
          name: one-health-db
          property: connectionString
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: ADMIN_EMAIL
        value: admin@ghs.gov.gh
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: GHS Administrator
      - key: SESSION_SECRET
        sync: false
      # Dashboard secrets - never pin empty strings here or a Blueprint apply wipes keys.
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODELS
        sync: false
      - key: GEMINI_IMAGE_MODELS
        sync: false
      - key: GEMINI_TTS_VOICE
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        sync: false
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: UNSPLASH_ACCESS_KEY
        sync: false
      - key: AGENT_MAX_STEPS
        sync: false
